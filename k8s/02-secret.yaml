# Secret: credenciales. "stringData" permite escribirlas en texto plano;
# Kubernetes las guarda codificadas en base64 (base64 NO es cifrado).
# En un entorno real NO suba este archivo con contraseñas reales a git;
# créelo con:
#   kubectl -n clase-k8s create secret generic relay-headers-credenciales \
#     --from-literal=ORIGEN_USUARIO=demo --from-literal=ORIGEN_PASSWORD='***'
apiVersion: v1
kind: Secret
metadata:
  name: relay-headers-credenciales
  namespace: clase-k8s
  labels:
    app: relay-headers
type: Opaque
stringData:
  ORIGEN_USUARIO: "demo"
  ORIGEN_PASSWORD: "cambiar-esta-clave"
  # Si el destino usa otras credenciales, descomente. Si no, se usan las del origen.
  # DESTINO_USUARIO: "publicador"
  # DESTINO_PASSWORD: "otra-clave"
